<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#140F2E">
<meta name="description" content="Kawho: live quiz games. Join with a PIN.">
<title>Kawho</title>
<link rel="icon" type="image/svg+xml" href="/kawho/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/kawho/kawho.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/kawho/kawho-core.js"></script>
<script>
  // players get the light player app; /kawho/host gets the studio
  (function () {
    var seg = location.pathname.replace(/^\/kawho\/?/, "").split("/")[0];
    var s = document.createElement("script");
    s.src = seg === "host" ? "/kawho/kawho-host.js" : "/kawho/kawho-play.js";
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
